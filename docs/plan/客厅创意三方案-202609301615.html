<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客厅创意三方案 · 变形示意</title>
<style>/* Design tokens：唯一的视觉数值来源，语义说明见项目 DESIGN.md 第 3、4 节 */
:root {
  /* 色彩：中性灰阶 */
  --c-bg: #fafafa;
  --c-surface-hover: #ededed;
  --c-surface-active: #e0e0e0;
  --c-border: #d4d4d4;
  --c-text: #171717;
  --c-text-2: #525252;
  --c-text-disabled: #a3a3a3;
  --c-selected-bg: #171717;
  --c-selected-text: #fafafa;
  --c-focus: #171717;
  --c-canvas-day: #d6d6d4;
  --c-canvas-night: #262626;

  /* 改动层级：明度递进，不使用彩色 */
  --c-level-0-bg: transparent;
  --c-level-0-text: #171717;
  --c-level-1-bg: #ededed;
  --c-level-1-text: #171717;
  --c-level-2-bg: #b5b5b5;
  --c-level-2-text: #171717;
  --c-level-3-bg: #404040;
  --c-level-3-text: #fafafa;

  /* 间距：4px 基数 */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  /* 尺寸 */
  --radius: 4px;
  --border-w: 1px;
  --focus-w: 2px;
  --focus-offset: 2px;
  --panel-w: 380px;
  --swatch: 24px;
  --stage-h-narrow: 60vh; /* 窄屏时 3D 画布高度 */
  --fallback-max-h: 70%; /* 出错兜底平面图的最大高度 */

  /* 字阶 */
  --font: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --fs-title: 20px;
  --fs-body: 14px;
  --fs-caption: 12px;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-bold: 600;
  --lh-title: 1.4;
  --lh-body: 1.6;
  --lh-label: 1.4;
  --lh-caption: 1.5;

  /* 动效 */
  --dur: 120ms;
  --ease: ease-out;
  --dur-transform: 600ms; /* 页面二：3D 变形件过渡 */
  --ease-transform: ease-in-out;
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur: 0ms; --dur-transform: 0ms; }
}

/* 页面样式：所有视觉数值引用 tokens.css */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-variant-numeric: tabular-nums;
}

.app {
  display: grid;
  grid-template-columns: 1fr var(--panel-w);
  height: 100%;
}

.stage { position: relative; overflow: hidden; min-width: 0; }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }

/* 浮层控件条 */
.bar {
  position: absolute;
  z-index: 1; /* 压在场景标签之上 */
  display: flex;
  gap: var(--s-2);
  padding: var(--s-1);
  background: var(--c-bg);
  border: var(--border-w) solid var(--c-border);
  border-radius: var(--radius);
}
.bar-top-left { top: var(--s-4); left: var(--s-4); }
.bar-top-right { top: var(--s-4); right: var(--s-4); }
.bar-bottom { bottom: var(--s-4); left: var(--s-4); align-items: center; }
.seg { display: flex; gap: var(--s-1); }
.seg + .seg { border-left: var(--border-w) solid var(--c-border); padding-left: var(--s-2); }
.bar-note { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--c-text-2); padding: 0 var(--s-2); }

/* 分段按钮：5a 交互状态 */
.btn {
  font: inherit;
  font-weight: var(--fw-medium);
  line-height: var(--lh-label);
  color: var(--c-text);
  background: transparent;
  border: 0;
  border-radius: var(--radius);
  padding: var(--s-1) var(--s-3);
  cursor: pointer;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { background: var(--c-surface-hover); }
.btn:active { background: var(--c-surface-active); }
.btn:focus-visible { outline: var(--focus-w) solid var(--c-focus); outline-offset: var(--focus-offset); }
.btn[aria-pressed="true"] { background: var(--c-selected-bg); color: var(--c-selected-text); }
.btn:disabled { color: var(--c-text-disabled); background: transparent; cursor: not-allowed; }

/* 场景内标签 */
.zone-label, .dim-label {
  font-size: var(--fs-caption);
  line-height: var(--lh-caption);
  color: var(--c-text);
  background: var(--c-bg);
  border: var(--border-w) solid var(--c-border);
  border-radius: var(--radius);
  padding: 0 var(--s-2);
  white-space: nowrap;
}
.dim-label { color: var(--c-text-2); }

/* 加载与出错（5b 数据状态） */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s-4);
  padding: var(--s-6);
  background: var(--c-bg);
  color: var(--c-text-2);
  text-align: center;
}
.overlay { z-index: 2; } /* 加载与出错遮罩盖住控件条 */
.overlay[hidden] { display: none; }
.overlay svg { width: 100%; max-height: var(--fallback-max-h); }

/* 侧栏 */
.panel {
  overflow-y: auto;
  border-left: var(--border-w) solid var(--c-border);
  padding: var(--s-5);
}
.panel h1 {
  font-size: var(--fs-title);
  line-height: var(--lh-title);
  font-weight: var(--fw-bold);
  margin: 0;
}
.panel h2 {
  font-size: var(--fs-body);
  line-height: var(--lh-label);
  font-weight: var(--fw-bold);
  margin: var(--s-5) 0 var(--s-2);
}
.panel p { margin: var(--s-3) 0 0; }
.caption { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--c-text-2); }
.notice {
  margin-top: var(--s-3);
  padding: var(--s-2) var(--s-3);
  border: var(--border-w) solid var(--c-border);
  border-radius: var(--radius);
}
.notice strong { font-weight: var(--fw-bold); color: var(--c-text); }

.facts { display: grid; grid-template-columns: auto 1fr; gap: var(--s-1) var(--s-3); margin: var(--s-3) 0 0; }
.facts dt { color: var(--c-text-2); }
.facts dd { margin: 0; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: auto 1fr; gap: var(--s-1) var(--s-2); padding: var(--s-2) 0; border-top: var(--border-w) solid var(--c-border); }
.list li:first-child { border-top: 0; }
.list .caption { grid-column: 2; }
.steps { margin: 0; padding-left: var(--s-5); }
.steps li { padding: var(--s-1) 0; }

.lv {
  font-size: var(--fs-caption);
  line-height: var(--lh-caption);
  font-weight: var(--fw-medium);
  padding: 0 var(--s-1);
  border-radius: var(--radius);
  border: var(--border-w) solid var(--c-border);
  align-self: start;
}
.lv-L0 { background: var(--c-level-0-bg); color: var(--c-level-0-text); }
.lv-L1 { background: var(--c-level-1-bg); color: var(--c-level-1-text); }
.lv-L2 { background: var(--c-level-2-bg); color: var(--c-level-2-text); }
.lv-L3 { background: var(--c-level-3-bg); color: var(--c-level-3-text); }
.dim { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--c-text-2); align-self: start; }

.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2) var(--s-3); }
.swatch { display: flex; align-items: center; gap: var(--s-2); }
.chip { width: var(--swatch); height: var(--swatch); border-radius: var(--radius); border: var(--border-w) solid var(--c-border); flex: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: var(--stage-h-narrow) auto; height: auto; }
  .panel { border-left: 0; border-top: var(--border-w) solid var(--c-border); }
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage" aria-label="客厅 3D 体块模型，拖动旋转，滚轮缩放">
    <canvas id="gl"></canvas>
    <div class="bar bar-top-left" role="group" aria-label="模型" id="modelBar"></div>
    <div class="bar bar-top-right">
      <div class="seg" role="group" aria-label="视图" id="viewBar"></div>
      <div class="seg" role="group" aria-label="光照" id="lightBar"></div>
    </div>
    <div class="bar bar-bottom" role="group" aria-label="使用状态" id="stateBar"></div>
    <div class="overlay" id="loading">正在构建模型…</div>
    <div class="overlay" id="error" hidden></div>
  </main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
